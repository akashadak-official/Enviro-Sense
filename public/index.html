<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviro Sense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow g1"></div>
  <div class="bg-glow g2"></div>

  <header id="brand" class="brand">
    <h1 class="brand-title">Enviro Sense</h1>
    <p class="brand-team">by team CyberNex HIT</p>
    <p class="brand-college">Haldia Institute of Technology</p>
    <p class="brand-dept">Department of Computer Science &amp; Engineering (Cyber Security)</p>
  </header>

  <main id="stage" class="stage">
    <h2 class="stage-heading">Select your mode</h2>

    <div class="mode-grid">
      <button class="mode-card" data-mode="local">
        <div class="mode-icon">📍</div>
        <h3>Local</h3>
        <p>Connects to the sensor on this network. The location is fixed and cannot be changed.</p>
      </button>

      <button class="mode-card" data-mode="global">
        <div class="mode-icon">🌍</div>
        <h3>Global</h3>
        <p>Search any city, such as Haldia, Kolkata or Mumbai, and connect to that location's sensor.</p>
      </button>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
